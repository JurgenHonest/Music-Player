<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="./img/favicon-32x32.png" />
    <script
      src="https://kit.fontawesome.com/c6d4c6daf2.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="music-player">
        <nav>
          <div class="circle">
            <i class="fa-solid fa-angle-left"></i>
          </div>
          <div class="circle" onclick="showLists()">
            <i class="fa-solid fa-bars"></i>
          </div>
        </nav>
        <div class="list">
          <div class="close-list" onclick="closelists()">
            <i class="fa-solid fa-xmark"></i>
          </div>
          <ul>
            <li onclick="loadSong(0)">Lisa - Unlasting Love</li>
            <li onclick="loadSong(1)">I Don't Think So</li>
            <li onclick="loadSong(2)">Arctic Monkeys - 505</li>
            <li onclick="loadSong(3)">Vance Joy - Riptide</li>
            <li onclick="loadSong(4)">Soap&Skin - Me and the Devil</li>
          </ul>
        </div>
        <div class="song-info">
          <img src="img/lisa.png" class="song-img" id="song-img" />
          <h1 class="title" id="title">Unlasting Love</h1>
          <p class="artist" id="artist">Lisa</p>
        </div>
        <audio controls id="songs">
          <source src="media/Unlasting Love.mp3" type="audio/mpeg" />
        </audio>
        <input type="range" value="0" id="progress" />
        <div class="controls">
          <div onclick="prevSong()">
            <i class="fa-solid fa-backward"></i>
          </div>
          <div onclick="playPause()">
            <i class="fa-solid fa-play" id="ctrlIcon"></i>
          </div>
          <div onclick="nextSong()">
            <i class="fa-solid fa-forward"></i>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
